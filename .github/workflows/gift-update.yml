name: 증정 트래킹 갱신

# GitHub 서버에서 실행되므로 내 PC가 꺼져 있어도 동작한다.
# cron 은 UTC 기준 — KST = UTC + 9시간.
#   KST 11:00~22:00, 30분마다 (하루 23회)
#   22시 이후~오전 11시는 갱신하지 않는다.
#   * GitHub 무료 러너의 예약 실행은 혼잡 시 5~20분 늦어질 수 있다.
on:
  schedule:
    - cron: "*/30 2-12 * * *"   # UTC 02:00~12:30 = KST 11:00~21:30
    - cron: "0 13 * * *"        # UTC 13:00      = KST 22:00 (마지막)
  workflow_dispatch:        # Actions 탭에서 수동 실행

concurrency:
  group: gift-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright openpyxl

      - name: 브라우저 캐시
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: 브라우저 설치
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: POS 조회 및 집계
        env:
          POS_ID: ${{ secrets.POS_ID }}
          POS_PW: ${{ secrets.POS_PW }}
        run: python -u gift_update.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/gift.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gift.json
          git commit -m "증정 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git push
