name: 증정 트래킹 갱신

# GitHub 서버에서 실행되므로 내 PC가 꺼져 있어도 동작한다.
# cron 은 UTC 기준 — KST = UTC + 9시간.
#   05:00 UTC = 14:00 KST   (점심 마감)
#   08:00 UTC = 17:00 KST
#   11:00 UTC = 20:00 KST
#   14:00 UTC = 23:00 KST   (마감)
on:
  schedule:
    - cron: "0 5,8,11,14 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행

concurrency:
  group: gift-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright openpyxl
          python -m playwright install --with-deps chromium

      - name: POS 조회 및 집계
        env:
          POS_ID: ${{ secrets.POS_ID }}
          POS_PW: ${{ secrets.POS_PW }}
        run: python -u gift_update.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/gift.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gift.json
          git commit -m "증정 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git push
